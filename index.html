            storyList.innerHTML = '';
            storiesData.forEach(story => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = "#";
                a.className = "block px-3 py-2 rounded-md text-gray-300 hover:bg-gray-700 hover:text-white transition-colors truncate";
                a.innerText = story.title;
                a.onclick = (e) => {
                    e.preventDefault();
                    loadStory(story.id);
                    if (window.innerWidth < 768) {
                        toggleSidebar();
                    }
                };
                li.appendChild(a);
                storyList.appendChild(li);
            });
        }

        function loadStory(id) {
            const story = storiesData.find(s => s.id === id);
            if (!story) return;

            storyTitle.innerText = story.title;
            storyTitle.style.color = story.accentColor;
            storyContent.innerHTML = story.content;
            storyImage.style.backgroundImage = `url('${story.imageUrl}')`;

            // Initialize accordion listeners for inline galleries
            initMobileGalleries();
        }

        // --- Mobile Image Gallery Accordion Logic ---
        function initMobileGalleries() {
            const galleries = document.querySelectorAll('.gallery');
            galleries.forEach(gallery => {
                const items = gallery.querySelectorAll('.gallery-item');
                
                items.forEach(item => {
                    const btn = item.querySelector('.expand-btn');
                    const icon = item.querySelector('.expand-icon');
                    
                    if(btn) {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const isExpanded = item.classList.contains('is-expanded');

                            // Collapse all items in this gallery
                            items.forEach(otherItem => {
                                otherItem.classList.remove('is-expanded', 'max-h-[500px]');
                                otherItem.classList.add('max-h-16');
                                const otherIcon = otherItem.querySelector('.expand-icon');
                                if(otherIcon) otherIcon.style.transform = 'rotate(0deg)';
                            });

                            // Expand the clicked one if it wasn't already expanded
                            if (!isExpanded) {
                                item.classList.add('is-expanded', 'max-h-[500px]');
                                item.classList.remove('max-h-16');
                                if(icon) icon.style.transform = 'rotate(180deg)';
                            }
                        });
                    }
                });
            });
        }

        function toggleSidebar() {
            if (window.innerWidth >= 768) {
                sidebarOpenDesktop = !sidebarOpenDesktop;
                if (sidebarOpenDesktop) {
                    sidebar.classList.remove('md:w-0');
                    sidebar.classList.add('md:w-64');
                } else {
                    sidebar.classList.remove('md:w-64');
                    sidebar.classList.add('md:w-0');
                }
            } else {
                sidebarOpenMobile = !sidebarOpenMobile;
                if (sidebarOpenMobile) {
                    sidebar.classList.remove('-translate-x-full');
                    sidebar.classList.add('translate-x-0', 'w-64');
                    mobileOverlay.classList.remove('hidden');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    sidebar.classList.remove('translate-x-0');
                    mobileOverlay.classList.add('hidden');
                }
            }
        }

        toggleBtn.addEventListener('click', toggleSidebar);
        mobileOverlay.addEventListener('click', toggleSidebar);

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                mobileOverlay.classList.add('hidden');
                sidebar.classList.remove('-translate-x-full', 'translate-x-0', 'w-64');
                if (sidebarOpenDesktop) {
                    sidebar.classList.add('md:w-64');
                } else {
                    sidebar.classList.add('md:w-0');
                }
            } else {
                sidebar.classList.remove('md:w-64', 'md:w-0');
                if (!sidebarOpenMobile) {
                    sidebar.classList.add('-translate-x-full');
                }
            }
        });
        
        if (window.innerWidth >= 768) {
            sidebar.classList.add('md:w-64');
            sidebar.classList.remove('md:w-0');
        }
    </script>
</body>
</html>
